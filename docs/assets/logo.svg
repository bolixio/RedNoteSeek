<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!--
    RedNoteSeek logo（白底红线：笔记本 + 放大镜，镜片里是放大 1.3 倍的正文）。
    app/src/main/res/drawable/ 下的 ic_launcher_foreground、ic_launcher_monochrome 都用这里的同一套 path
    （1024 坐标系），只在外层 group 上缩放。改图形时三处一起改。
  -->
  <rect width="1024" height="1024" fill="#FFFFFF"/>
  <!-- 本子在镜片周围断开：外框顺时针 + 圆逆时针，nonzero 规则下挖出一个洞 -->
  <clipPath id="lens-gap">
    <path d="M-200,-200 H1224 V1224 H-200 Z M393,575 A212,212 0 1 0 817,575 A212,212 0 1 0 393,575 Z"/>
  </clipPath>
  <!-- 镜片内侧 -->
  <clipPath id="lens-inner">
    <path d="M493,575 A112,112 0 1 0 717,575 A112,112 0 1 0 493,575 Z"/>
  </clipPath>
  <g fill="none" stroke="#FF2442" stroke-linecap="round" stroke-linejoin="round">
    <g clip-path="url(#lens-gap)">
      <!-- 本身、书脊、正文 -->
      <path stroke-width="62" d="M240,130 H610 A90,90 0 0 1 700,220 V790 A90,90 0 0 1 610,880 H240 A90,90 0 0 1 150,790 V220 A90,90 0 0 1 240,130 Z"/>
      <path stroke-width="50" d="M300,160 V850"/>
      <path stroke-width="34" d="M390,400 H640 M390,470 H640 M390,540 H640 M390,610 H580 M390,680 H500"/>
    </g>
    <!-- 书签 -->
    <path fill="#FF2442" stroke-width="20" d="M520,130 V310 L565,272 L610,310 V130 Z"/>
    <!-- 透过镜片看到的正文：同一组正文以镜片中心为原点放大 1.3 倍 -->
    <g clip-path="url(#lens-inner)">
      <path stroke-width="34" transform="translate(605,575) scale(1.3) translate(-605,-575)" d="M390,400 H640 M390,470 H640 M390,540 H640 M390,610 H580 M390,680 H500"/>
    </g>
    <!-- 放大镜：镜片 + 镜柄 -->
    <path stroke-width="52" d="M445,575 A160,160 0 1 0 765,575 A160,160 0 1 0 445,575 Z"/>
    <path stroke-width="92" d="M765,735 L840,810"/>
  </g>
</svg>
